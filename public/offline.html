<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0d3b73" />
    <meta name="robots" content="noindex" />
    <title>Sin conexión | ACL Propiedades</title>
    <style>
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 1.5rem;
        background: #0a1120;
        color: #e8eef8;
        font-family: system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
        text-align: center;
      }
      main { max-width: 420px; }
      img { width: 84px; height: 84px; border-radius: 18px; }
      h1 { font-size: 1.5rem; margin: 1.25rem 0 0.5rem; }
      p { color: #a9b6cc; line-height: 1.5; margin: 0 0 1.5rem; }
      button {
        border: 0;
        border-radius: 10px;
        padding: 0.85rem 1.6rem;
        font-size: 1rem;
        font-weight: 600;
        background: #1565c0;
        color: #fff;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <main>
      <img src="/icon-192.png" alt="ACL Propiedades" />
      <h1>Sin conexión</h1>
      <p>No hay internet en este momento. Revisa tu conexión y vuelve a intentar: tus datos siguen guardados y no se perdió nada.</p>
      <button type="button" onclick="location.reload()">Reintentar</button>
    </main>
  </body>
</html>
