name: Registrar cambio en Novedades del sitio

# Cada vez que un pull request se fusiona a main (un cambio real que ya
# quedó publicado), esto inserta una entrada automática en site_updates
# con el título y la descripción del PR — así nadie tiene que entrar al
# panel a escribirla a mano, como pide el apartado /admin/novedades.
# Necesita tres secretos del repositorio (Settings > Secrets and variables >
# Actions): SUPABASE_URL, SUPABASE_ANON_KEY (la llave pública, la misma que
# usa el sitio) y NOVEDADES_TOKEN (un valor largo y aleatorio que también se
# guarda en Vault de Supabase con el nombre `novedades_token`, ver la
# migración 0124). Llama a la función registrar_novedad, que solo puede
# insertar una fila en site_updates: si el token se filtra, lo máximo que
# alguien consigue es escribir una novedad — ya no se guarda la llave
# service_role (acceso total a la base) en GitHub. Si faltan, el paso se
# salta sin tronar el workflow (por ejemplo, en un fork).

on:
  pull_request:
    types: [closed]
    branches: [main]

jobs:
  log-update:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    steps:
      - name: Insertar la entrada en site_updates
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          NOVEDADES_TOKEN: ${{ secrets.NOVEDADES_TOKEN }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_ANON_KEY" ] || [ -z "$NOVEDADES_TOKEN" ]; then
            echo "Faltan los secretos SUPABASE_URL / SUPABASE_ANON_KEY / NOVEDADES_TOKEN en este repositorio; se omite el registro automático de esta entrada (ver README, sección Novedades del sitio)."
            exit 0
          fi

          PAYLOAD=$(jq -n \
            --arg token "$NOVEDADES_TOKEN" \
            --arg title "$PR_TITLE" \
            --arg body "${PR_BODY:-Sin descripción.}" \
            --arg url "$PR_URL" \
            --arg author "$PR_AUTHOR" \
            '{p_token: $token, p_title: $title, p_body: ($body + "\n\nPR: " + $url), p_author: $author}')

          RESPONSE=$(curl -sS -f -X POST "$SUPABASE_URL/rest/v1/rpc/registrar_novedad" \
            -H "apikey: $SUPABASE_ANON_KEY" \
            -H "Authorization: Bearer $SUPABASE_ANON_KEY" \
            -H "Content-Type: application/json" \
            -d "$PAYLOAD")
          echo "$RESPONSE"
          # La función responde {"ok": true} o {"error": "..."}: un token equivocado no es un error HTTP.
          echo "$RESPONSE" | jq -e '.ok == true' > /dev/null
